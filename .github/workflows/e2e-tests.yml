name: CiviFix E2E Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Selenium E2E Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Google Chrome & ChromeDriver
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f selenium_tests/requirements.txt ]; then pip install -r selenium_tests/requirements.txt; fi
        
    - name: Run E2E Tests
      env:
        HEADLESS: "true"
      run: |
        # Run tests focusing on our 500-550 positive scenarios
        python selenium_tests/run_tests.py
        
    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: e2e-test-reports
        path: |
          selenium_tests/*.xlsx
          selenium_tests/selenium_tests.log
          selenium_tests/*.png
        retention-days: 7
