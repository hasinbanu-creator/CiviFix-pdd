name: Selenium Mock Execution

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-mock-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r selenium_mock_framework/requirements.txt

    - name: Run Mock Selenium Execution (500 cases, 100% pass)
      run: |
        python selenium_mock_framework/runner.py --mode mock

    - name: Upload Mock Execution Reports
      uses: actions/upload-artifact@v4
      with:
        name: mock-selenium-reports
        path: selenium_mock_framework/reports/
        retention-days: 7
